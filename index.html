<!DOCTYPE html>
<html lang="en">

<head>

  <!-- trigger GitHub Pages -->
  
  <!-- =========================================================
       PAGE SETTINGS
       ========================================================= -->

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Government Property Animation</title>

  <link rel="stylesheet" href="style.css">

</head>


<body>


  <!-- =========================================================
       TIKTOK ANIMATION STAGE

       Everything inside this box becomes the vertical
       9:16 animation.
       ========================================================= -->

  <main class="stage">


    <!-- =======================================================
         SCENE 1
         RED PATHS / INSTITUTIONAL MAP
         ======================================================= -->

    <div class="world">


      <!-- Red route lines -->

      <div class="route route-one"></div>

      <div class="route route-two"></div>

      <div class="route route-three"></div>

      <div class="route route-four"></div>

      <div class="route route-five"></div>


      <!-- =====================================================
           CONCRETE STRUCTURES

           These blocks will slide into position and create
           the brutalist institutional environment.
           ===================================================== -->

      <div class="building block-one"></div>

      <div class="building block-two"></div>

      <div class="building block-three"></div>

      <div class="building block-four"></div>

      <div class="building block-five"></div>

      <div class="building block-six"></div>


    </div>



    <!-- =======================================================
         SCENE 2
         CUFFED FIGURE

         This appears after the institution fades away.
         ======================================================= -->

    <div class="final-scene">


      <!-- Red backlight -->

      <div class="red-glow"></div>


      <!-- Human silhouette -->

      <div class="person">

        <div class="head"></div>

        <div class="body"></div>


        <!-- Left arm -->

        <div class="arm arm-left"></div>


        <!-- Right arm -->

        <div class="arm arm-right"></div>


        <!-- Hands -->

        <div class="hand hand-left"></div>

        <div class="hand hand-right"></div>


        <!-- Metal cuffs -->

        <div class="cuff cuff-left"></div>

        <div class="cuff cuff-right"></div>


        <!-- Chain between cuffs -->

        <div class="chain"></div>

      </div>


      <!-- =====================================================
           FINAL TITLE
           ===================================================== -->

      <div class="final-title">

        <h1>
          GOVERNMENT<br>
          PROPERTY
        </h1>

        <p>LEENA</p>

      </div>


    </div>


  </main>


</body>

</html>
