<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Government Property - Hallway Test</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- =========================================================
       SCENE ONE
       FIRST-PERSON GOVERNMENT FACILITY HALLWAY
       ========================================================= -->

  <main class="stage">

    <div class="hall">

      <!-- Far wall -->
      <div class="back-wall">

        <div class="door">
          <div class="door-light"></div>
        </div>

      </div>


      <!-- Ceiling -->
      <div class="ceiling">

        <div class="ceiling-light light-one"></div>
        <div class="ceiling-light light-two"></div>
        <div class="ceiling-light light-three"></div>
        <div class="ceiling-light light-four"></div>

      </div>


      <!-- Left wall -->
      <div class="wall wall-left">

        <div class="panel p1"></div>
        <div class="panel p2"></div>
        <div class="panel p3"></div>
        <div class="panel p4"></div>

      </div>


      <!-- Right wall -->
      <div class="wall wall-right">

        <div class="panel p1"></div>
        <div class="panel p2"></div>
        <div class="panel p3"></div>
        <div class="panel p4"></div>

      </div>


      <!-- Floor -->
      <div class="floor">

        <div class="red-path"></div>

      </div>


      <!-- Dark cinematic edges -->
      <div class="vignette"></div>

    </div>

  </main>

</body>

</html>
